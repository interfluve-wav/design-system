<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bonk! · libraries.dev effects — brand-correct</title>
  <style>
    /* Bonk! production design tokens (design.md, Aug 2026) */
    /* Brand rule: orange #ff6b1a is the ONLY color on a brand surface; else white on black. */
    :root{
      --black:#000000; --jet:#161616; --raised:#1a1a1a;
      --orange:#ff6b1a; --orange-soft:rgba(255,107,26,0.12); --orange-glow:rgba(255,107,26,0.35);
      --orange-text:#ffb37a;
      --white:#ffffff; --ink-dim:rgba(255,255,255,0.55);
      --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
      --sans:Inter,system-ui,-apple-system,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:var(--black);color:var(--white);font-family:var(--mono);overflow:hidden}
    #grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;width:100%;height:100%;padding:12px}
    .cell{position:relative;border-radius:14px;overflow:hidden;background:var(--jet);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.08)}
    .cell canvas{position:absolute;inset:0;width:100%;height:100%}
    .cell .tag{position:absolute;top:10px;left:12px;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--ink-dim)}
    .beam-card{position:absolute;inset:0;border-radius:14px;background:var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
    .beam-card .word{font-family:var(--sans);font-weight:700;font-size:clamp(30px,4.5vw,58px);letter-spacing:0.02em;color:var(--white)}
    .beam-card .word b{color:var(--orange);font-weight:700}
    .beam-card .sub{font-family:var(--mono);font-size:11px;letter-spacing:0.25em;text-transform:uppercase;color:var(--orange-text)}
    .liquid-word{position:relative;z-index:2;font-family:var(--sans);font-weight:800;font-size:clamp(36px,5.5vw,72px);letter-spacing:0.02em;color:var(--white)}
  </style>
</head>
<body>
  <div id="grid">
    <div class="cell" id="beam">
      <canvas id="beamCanvas"></canvas>
      <div class="tag">border-beam · libraries.dev</div>
      <div class="beam-card">
        <div class="word">bon<b>k!</b></div>
        <div class="sub">music comes first</div>
      </div>
    </div>

    <div class="cell" id="gooey">
      <canvas id="gooeyCanvas"></canvas>
      <div class="tag">liquid-gooey · libraries.dev</div>
    </div>

    <div class="cell" id="metal">
      <canvas id="metalCanvas"></canvas>
      <div class="tag">metal-fx · libraries.dev</div>
      <div class="liquid-word">BONK</div>
    </div>

    <div class="cell" id="orbs">
      <canvas id="orbsCanvas"></canvas>
      <div class="tag">thinking-orbs · libraries.dev</div>
    </div>
  </div>

  <script>
  // Shared cell setup
  function setupCell(id){
    const cv=document.getElementById(id+'Canvas'), ctx=cv.getContext('2d');
    let W=0,H=0;
    function resize(){const r=cv.parentElement.getBoundingClientRect();const dpr=Math.min(devicePixelRatio||1,2);cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);W=r.width;H=r.height;}
    resize(); window.addEventListener('resize', resize);
    return {cv,ctx,get W(){return W},get H(){return H}};
  }
  const ORANGE='#ff6b1a', ORANGE_SOFT='rgba(255,107,26,0.25)', WHITE='#ffffff';

  // 1. BORDER-BEAM — orange glow sweeping the perimeter
  (function(){
    const cv=document.getElementById('beamCanvas'), ctx=cv.getContext('2d');
    let W=0,H=0,t=0;
    function resize(){const r=cv.parentElement.getBoundingClientRect();const dpr=Math.min(devicePixelRatio||1,2);cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);W=r.width;H=r.height;}
    resize(); window.addEventListener('resize', resize);
    function ptAt(frac){const m=6,perim=2*(W-2*m)+2*(H-2*m);const p=frac*perim;
      if(p<W-2*m)return[m+p,m];if(p<W+H-4*m)return[W-m,m+(p-(W-2*m))];if(p<2*(W-2*m)+H-2*m)return[W-m-(p-(W+H-4*m)),H-m];return[m,H-m-(p-(2*(W-2*m)+H-2*m))];}
    function frame(){t+=0.016;ctx.clearRect(0,0,W,H);
      const travel=(t*0.32)%1;
      ctx.lineCap='round';
      // bright head
      ctx.lineWidth=3;ctx.strokeStyle=ORANGE;ctx.shadowBlur=22;ctx.shadowColor=ORANGE;
      const[sx,sy]=ptAt(travel),[ex,ey]=ptAt(travel+0.14);
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
      // tail
      ctx.lineWidth=8;ctx.shadowBlur=0;ctx.globalAlpha=0.18;ctx.strokeStyle=ORANGE;
      const[tx,ty]=ptAt((travel+0.14+0.10)%1);
      ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(tx,ty);ctx.stroke();ctx.globalAlpha=1;
      requestAnimationFrame(frame);}
    requestAnimationFrame(frame);
  })();

  // 2. LIQUID-GOOEY — orange fluid metaballs (white core / orange body)
  (function(){
    const {cv,ctx,W,H}=setupCell('gooey');
    let t=0;
    const balls=[{x:.32,y:.5,r:.17},{x:.55,y:.44,r:.21},{x:.74,y:.6,r:.13}];
    function frame(){t+=0.016;const w=W,h=H;
      ctx.clearRect(0,0,w,h);
      const layer=document.createElement('canvas');layer.width=Math.round(w);layer.height=Math.round(h);
      const lctx=layer.getContext('2d');
      for(const b of balls){const cx=b.x*w+Math.sin(t*0.8)*8,cy=b.y*h+Math.cos(t*0.7)*8,rad=b.r*Math.min(w,h);
        const g=lctx.createRadialGradient(cx,cy,0,cx,cy,rad);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.7,'rgba(255,255,255,0.85)');g.addColorStop(1,'rgba(255,255,255,0)');
        lctx.fillStyle=g;lctx.fillRect(0,0,layer.width,layer.height);}
      ctx.filter='blur(20px)';ctx.drawImage(layer,0,0);ctx.filter='none';
      ctx.globalCompositeOperation='source-in';
      ctx.fillStyle=ORANGE;ctx.fillRect(0,0,w,h);
      ctx.globalCompositeOperation='source-over';
      requestAnimationFrame(frame);}
    requestAnimationFrame(frame);
  })();

  // 3. METAL-FX — iridescent, but brand-restrained: orange-to-white liquid sheen
  (function(){
    const{cv,ctx,W,H}=setupCell('metal');
    let t=0;
    function frame(){t+=0.016;const w=W,h=H;ctx.clearRect(0,0,w,h);
      const shift=(Math.sin(t*0.6)+1)/2;
      const g=ctx.createLinearGradient(0,0,w,h);
      g.addColorStop(0,WHITE);
      g.addColorStop(shift*0.7+0.1,ORANGE);
      g.addColorStop(1,WHITE);
      ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
      // moving highlight streak
      ctx.globalAlpha=0.35;
      const hx=((t*0.25)%1.2-0.1)*w;
      ctx.fillStyle=WHITE;
      ctx.filter='blur(10px)';
      ctx.fillRect(hx,0,h*0.15,h);
      ctx.filter='none';ctx.globalAlpha=1;
      requestAnimationFrame(frame);}
    requestAnimationFrame(frame);
  })();

  // 4. THINKING-ORBS — tiny orange status orbs (brand: single accent color)
  (function(){
    const{cv,ctx,W,H}=setupCell('orbs');
    let t=0;
    const orbs=[{x:.3,y:.5,r:.11,phase:0},{x:.5,y:.45,r:.14,phase:2.1},{x:.7,y:.55,r:.11,phase:4.2}];
    function frame(){t+=0.016;const w=W,h=H;ctx.clearRect(0,0,w,h);
      for(const o of orbs){const cx=o.x*w+Math.sin(t*1.2+o.phase)*9,cy=o.y*h+Math.cos(t+o.phase)*8;
        const pulse=0.5+0.5*Math.sin(t*2+o.phase);const rad=(o.r*Math.min(w,h))*(0.85+0.3*pulse);
        let g=ctx.createRadialGradient(cx,cy,0,cx,cy,rad*2.2);g.addColorStop(0,'rgba(255,107,26,0.85)');g.addColorStop(.6,'rgba(255,107,26,0.18)');g.addColorStop(1,'rgba(255,107,26,0)');
        ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
        g=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);g.addColorStop(0,'#ffffff');g.addColorStop(.35,'#ffb37a');g.addColorStop(1,ORANGE);
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,rad,0,7);ctx.fill();}
      requestAnimationFrame(frame);}
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
