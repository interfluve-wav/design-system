<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Design Tiles — motion/design</title>
  <style>
    html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden;font-family:system-ui,-apple-system,Helvetica,Arial,sans-serif}
    #root{width:100vw;height:100vh}
    #hint{position:fixed;top:12px;left:12px;color:#666;font-size:12px;z-index:10;pointer-events:none;font-family:monospace}
  </style>
</head>
<body>
  <div id="hint">design is how it works · hover to grow · colors auto-shuffle</div>
  <div id="root"></div>
  <script>
  // ─── PALETTE ──────────────────────────────────────────────────────
  const WORDS = ["design", "is", "how", "it", "works"];

  const SWATCHES = [
    { bg: "#0a0a0a", fg: "#ffffff" },
    { bg: "#ff2e20", fg: "#0a0a0a" },
    { bg: "#f0c2f7", fg: "#0a0a0a" },
    { bg: "#22e58b", fg: "#0a0a0a" },
    { bg: "#7c4dff", fg: "#ffffff" },
    { bg: "#ffe14d", fg: "#0a0a0a" },
    { bg: "#18b6ff", fg: "#0a0a0a" },
    { bg: "#ff7a1a", fg: "#0a0a0a" },
    { bg: "#ff4fa3", fg: "#0a0a0a" },
  ];

  function randomSwatch(exclude) {
    if (SWATCHES.length < 2 || !exclude) return SWATCHES[(Math.random() * SWATCHES.length) | 0];
    let s = exclude;
    while (s === exclude) s = SWATCHES[(Math.random() * SWATCHES.length) | 0];
    return s;
  }

  function randomSwatchAvoiding(used) {
    const free = SWATCHES.filter(s => !used.includes(s));
    const pool = free.length > 0 ? free : SWATCHES;
    return pool[(Math.random() * pool.length) | 0];
  }

  const INITIAL = [
    SWATCHES[0], SWATCHES[1], SWATCHES[2], SWATCHES[3], SWATCHES[4],
  ];

  // ─── MEASURE ──────────────────────────────────────────────────────
  const REF_FS = 29.2;  // was 16 → 19.2 → 29.2 (+10px)
  const BASELINE_Y = 23.7;

  function measureWord(word, fontFamily, weight) {
    const cv = document.createElement("canvas");
    cv.width = 2048;
    cv.height = 64;
    const ctx = cv.getContext("2d");
    if (!ctx) return null;

    ctx.font = `${weight} ${REF_FS}px ${fontFamily}`;
    ctx.textBaseline = "alphabetic";
    ctx.textAlign = "left";

    const metrics = ctx.measureText(word);
    const fullW = metrics.width;
    const ascent = metrics.actualBoundingBoxAscent;
    const descent = metrics.actualBoundingBoxDescent;

    const glyphs = [];
    let cx = 0;
    for (const ch of word) {
      const gm = ctx.measureText(ch);
      glyphs.push({ ch, x: cx, w: gm.width, top: -ascent, bottom: descent });
      cx += gm.width;
    }

    return { width: fullW, glyphs };
  }

  // ─── ENGINE ───────────────────────────────────────────────────────
  const SVGNS = "http://www.w3.org/2000/svg";
  const FLY_STAGGER = 130;
  const FLY_MS = 760;
  const SHUFFLE_MIN = 1300;
  const SHUFFLE_MAX = 3200;
  const COLOR_MS = 520;
  const PAD_Y = 6;
  const PAD_X = 2;
  const BAND_ASCENT = 149;   // was 82 → 98 → 149
  const BAND_DESCENT = 47;   // was 26 → 31 → 47

  class DesignTiles {
    constructor(host) {
      this.host = host;
      this.tiles = [];
      this.raf = 0;
      this.running = false;
      this.disposed = false;
      this.revealed = false;
      this.now = 0;
      this.cleanup = [];
      this.ro = null;
      this.fontFamily = "system-ui, -apple-system, Helvetica, Arial, sans-serif";

      const root = document.createElement("div");
      Object.assign(root.style, {
        position: "absolute",
        inset: "0",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        userSelect: "none",
      });
      root.setAttribute("aria-label", WORDS.join(" "));

      this.fontFamily = getComputedStyle(root).fontFamily || this.fontFamily;

      const bar = document.createElement("div");
      Object.assign(bar.style, { display: "flex", alignItems: "center", gap: "0.4em", flexWrap: "wrap", justifyContent: "center" });

      WORDS.forEach((word, i) => {
        const sw = INITIAL[i] || randomSwatchAvoiding([]);
        const outer = document.createElement("span");
        Object.assign(outer.style, {
          display: "inline-block",
          overflow: "hidden",
          verticalAlign: "middle",
          width: "0px",
          transition: `width ${FLY_MS}ms cubic-bezier(.16,1,.3,1)`,
        });

        const clip = document.createElement("span");
        clip.style.display = "inline-block";
        clip.style.verticalAlign = "middle";
        clip.style.whiteSpace = "nowrap";

        const svg = document.createElementNS(SVGNS, "svg");
        Object.assign(svg.style, {
          display: "block",
          height: "clamp(3.1rem, 5.7vw, 5.0rem)",
          opacity: "0",
          transition: `opacity ${Math.round(FLY_MS * 0.8)}ms ease`,
          // width will be set after layout based on aspect ratio
        });

        const gBg = document.createElementNS(SVGNS, "g");
        const textEl = document.createElementNS(SVGNS, "text");
        textEl.setAttribute("font-family", this.fontFamily);
        textEl.setAttribute("font-weight", "500");
        textEl.setAttribute("font-size", String(REF_FS));
        textEl.setAttribute("dominant-baseline", "alphabetic");
        textEl.style.fill = sw.fg;
        textEl.style.transition = `fill ${COLOR_MS}ms ease`;
        textEl.textContent = word;

        svg.appendChild(gBg);
        svg.appendChild(textEl);
        clip.appendChild(svg);
        outer.appendChild(clip);
        bar.appendChild(outer);

        this.tiles.push({
          outer, svg, rects: [], textEl,
          word, swatch: sw, nextShuffle: 0,
        });
      });

      root.appendChild(bar);
      host.appendChild(root);
      this.root = root;
      this.bar = bar;

      this.layout();
      this.bindEvents();
    }

    layout() {
      for (const tile of this.tiles) {
        const m = measureWord(tile.word, this.fontFamily, "500");
        for (const r of tile.rects) r.el.remove();
        tile.rects = [];
        if (!m) continue;

        const gBg = tile.svg.firstChild;

        for (let i = 0; i < m.glyphs.length; i++) {
          const g = m.glyphs[i];
          if (g.ch === " ") continue;

          // In the new coordinate system, y=0 is the baseline. glyph.top is negative (above),
          // glyph.bottom is positive (below). Add PAD_Y on each side.
          const top = g.top - PAD_Y;
          const bottom = g.bottom + PAD_Y;

          const next = m.glyphs[i + 1];
          const right = next ? next.x : g.x + g.w;
          const left = g.x - (i === 0 ? PAD_X : 0);
          const width = right - left + PAD_X;

          const rect = document.createElementNS(SVGNS, "rect");
          rect.setAttribute("x", String(left));
          rect.setAttribute("y", String(top));
          rect.setAttribute("width", String(width));
          rect.setAttribute("height", String(bottom - top));
          rect.style.fill = tile.swatch.bg;
          rect.style.transition = `fill ${COLOR_MS}ms ease, y 160ms ease, height 160ms ease`;

          gBg.appendChild(rect);
          tile.rects.push({ el: rect, x0: left, x1: left + width, baseY: top, baseH: bottom - top, hovered: false });
        }

        tile.textEl.setAttribute("x", "0");
        tile.textEl.setAttribute("y", "0");

        // Simple viewBox: just the word's measured width, with plenty of vertical room for the text.
        // The text font-size is set in user units; the SVG is scaled to fit a fixed pixel height.
        const vbX = -PAD_X;
        const vbY = -REF_FS;  // generous room above the baseline
        const vbW = m.width + PAD_X * 2;
        const vbH = REF_FS * 1.4;  // enough room for ascender + descender at this font size
        tile.svg.setAttribute("viewBox", `${vbX} ${vbY} ${vbW} ${vbH}`);
        tile.svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
        tile.svg.removeAttribute("width");
        tile.svg.removeAttribute("height");
        // Set pixel width from viewBox aspect × current rendered height
        const setSvgWidth = () => {
          const h = tile.svg.getBoundingClientRect().height;
          if (h > 0) {
            const aspect = vbW / vbH;
            const pxW = Math.round(h * aspect);
            tile.svg.style.width = pxW + "px";
            return true;
          }
          return false;
        };
        if (!setSvgWidth()) {
          requestAnimationFrame(() => {
            if (!setSvgWidth()) setTimeout(setSvgWidth, 50);
          });
        }
      }
    }

    bindEvents() {
      this.tiles.forEach((tile) => {
        const onEnter = () => this.recolor(tile);
        tile.svg.addEventListener("pointerenter", onEnter);

        const onMove = (e) => this.hoverLetter(tile, e);
        const onLeave = () => this.clearHover(tile);
        tile.svg.addEventListener("pointermove", onMove);
        tile.svg.addEventListener("pointerleave", onLeave);

        this.cleanup.push(() => {
          tile.svg.removeEventListener("pointerenter", onEnter);
          tile.svg.removeEventListener("pointermove", onMove);
          tile.svg.removeEventListener("pointerleave", onLeave);
        });
      });

      this.ro = new ResizeObserver(() => this.layout());
      this.ro.observe(this.host);
    }

    hoverLetter(tile, e) {
      const rect = tile.svg.getBoundingClientRect();
      if (rect.width < 1) return;
      const vb = tile.svg.viewBox.baseVal;
      const scale = vb.width / rect.width;
      const grow = 2 * scale;
      const px = vb.x + ((e.clientX - rect.left) / rect.width) * vb.width;

      for (const r of tile.rects) {
        const isHit = px >= r.x0 && px < r.x1;
        if (isHit === r.hovered) continue;
        r.hovered = isHit;
        if (isHit) {
          r.el.style.y = `${r.baseY - grow / 2}px`;
          r.el.style.height = `${r.baseH + grow}px`;
        } else {
          r.el.style.y = `${r.baseY}px`;
          r.el.style.height = `${r.baseH}px`;
        }
      }
    }

    clearHover(tile) {
      for (const r of tile.rects) {
        if (!r.hovered) continue;
        r.hovered = false;
        r.el.style.y = `${r.baseY}px`;
        r.el.style.height = `${r.baseH}px`;
      }
    }

    recolor(tile) {
      const used = this.tiles.filter(t => t !== tile).map(t => t.swatch);
      const sw = randomSwatchAvoiding(used);
      tile.swatch = sw;
      for (const r of tile.rects) r.el.style.fill = sw.bg;
      tile.textEl.style.fill = sw.fg;
    }

    refreshFont() {
      this.fontFamily = getComputedStyle(this.root).fontFamily || this.fontFamily;
      for (const tile of this.tiles) tile.textEl.setAttribute("font-family", this.fontFamily);
      this.layout();
    }

    reveal() {
      if (this.revealed) return;
      this.revealed = true;

      this.tiles.forEach((tile, i) => {
        const delay = i * FLY_STAGGER;
        const t = window.setTimeout(() => {
          // Measure natural width: temporarily set outer to fit-content, read width, then animate to it
          const prevW = tile.outer.style.width;
          tile.outer.style.width = "fit-content";
          const natural = tile.outer.getBoundingClientRect().width;
          tile.outer.style.width = prevW || "0px";
          // Force reflow so the browser commits "0px" before we change to natural width
          void tile.outer.offsetWidth;
          tile.outer.style.width = natural + "px";
          tile.svg.style.opacity = "1";
        }, delay);
        this.cleanup.push(() => window.clearTimeout(t));
      });

      const assembledAt = this.tiles.length * FLY_STAGGER + FLY_MS;
      this.tiles.forEach((tile) => {
        tile.nextShuffle = performance.now() + assembledAt + SHUFFLE_MIN + Math.random() * (SHUFFLE_MAX - SHUFFLE_MIN);
      });
    }

    start() {
      if (this.running || this.disposed) return;
      this.running = true;
      this.reveal();
      this.raf = requestAnimationFrame(this.loop);
    }

    stop() {
      this.running = false;
      if (this.raf) cancelAnimationFrame(this.raf);
      this.raf = 0;
    }

    loop = () => {
      if (!this.running) return;
      this.now = performance.now();
      for (const tile of this.tiles) {
        if (tile.nextShuffle === 0) continue;
        if (this.now >= tile.nextShuffle) {
          this.recolor(tile);
          tile.nextShuffle = this.now + SHUFFLE_MIN + Math.random() * (SHUFFLE_MAX - SHUFFLE_MIN);
        }
      }
      this.raf = requestAnimationFrame(this.loop);
    };

    renderStill() {
      this.revealed = true;
      for (const tile of this.tiles) {
        tile.outer.style.transition = "none";
        tile.outer.style.width = "fit-content";
        tile.svg.style.transition = "none";
        tile.svg.style.opacity = "1";
      }
    }

    destroy() {
      this.disposed = true;
      this.stop();
      this.ro && this.ro.disconnect();
      this.cleanup.forEach(fn => fn());
      this.root.parentNode && this.root.parentNode.removeChild(this.root);
    }
  }

  // ─── BOOT ─────────────────────────────────────────────────────────
  const host = document.getElementById("root");
  const params = new URLSearchParams(location.search);

  // Allow ?words=hello+world+this+is+a+test to override the default word list
  const urlWords = params.get("words");
  if (urlWords) {
    const list = urlWords.split(/[\s,+]+/).filter(Boolean).slice(0, 12);
    if (list.length) WORDS.length = 0, list.forEach(w => WORDS.push(w));
  }

  // Allow ?colors=ff2e20,0a0a0a,22e58b,7c4dff to override the swatch palette
  const urlColors = params.get("colors");
  if (urlColors) {
    const norm = (h) => h.startsWith("#") ? h : "#" + h;
    const hexes = urlColors.split(/[\s,]+/).filter(Boolean).map(norm);
    const next = [];
    for (let i = 0; i < hexes.length; i += 2) {
      if (i + 1 >= hexes.length) break;
      next.push({ bg: hexes[i], fg: hexes[i + 1] });
    }
    if (next.length) {
      SWATCHES.length = 0;
      next.forEach(s => SWATCHES.push(s));
      // Re-seed INITIAL with the new palette
      INITIAL.length = 0;
      for (let i = 0; i < WORDS.length; i++) {
        INITIAL.push(SWATCHES[i % SWATCHES.length]);
      }
    }
  }

  // Disable auto-shuffle if ?auto=0
  const autoOff = params.get("auto") === "0";

  const tiles = new DesignTiles(host);
  tiles.start();
  window.__tiles = tiles;

  // Update hint text to reflect the actual words being displayed
  const hint = document.getElementById("hint");
  if (hint) hint.textContent = `${WORDS.join(" ")} · hover to grow · colors auto-shuffle`;

  // Auto-cycle the active swatch between palettes to keep the page lively
  let activeIdx = 0;
  if (!autoOff) setInterval(() => {
    const used = tiles.tiles.filter((t, i) => i !== activeIdx).map(t => t.swatch);
    const tile = tiles.tiles[activeIdx];
    if (!tile) return;
    const sw = randomSwatchAvoiding(used);
    tile.swatch = sw;
    for (const r of tile.rects) r.el.style.fill = sw.bg;
    tile.textEl.style.fill = sw.fg;
    activeIdx = (activeIdx + 1) % tiles.tiles.length;
  }, 2200);
  </script>
</body>
</html>
