<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>bonk.dj — superscript watermark / blueprint</title>
<style>
  @font-face { font-family: 'IBM Plex Mono Bonk'; src: url('./fonts/IBMPlexMono-Regular.ttf') format('truetype');
               font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: 'IBM Plex Mono Bonk'; src: url('./fonts/IBMPlexMono-SemiBold.ttf') format('truetype');
               font-weight: 600; font-style: normal; font-display: block; }
  /* ── THEME ────────────────────────────────────────────────────────────────
     Colour lives HERE. The JS constants below are only fallbacks; applyTheme()
     copies these in at boot, so a variant is a variable change, not a code edit.

     This is the first mark with TWO accent tiers, so there are two accent
     variables rather than one. They are deliberately independent: the whole
     point of the superscript lockup is that the small dj can carry its own
     colour, and the watermark register leans on that (main fainter than dj). */
  :root{
    --ground:#0b0b0b;
    --accent:#8fb3a9;          /* pastel earthy teal — the word */
    --accent-2:#b0a0d0;        /* pastel earthy purple — the superscript dj */
    --accent-soft:#cfe3dd;
    --accent-glow:rgba(143,179,169,0.32);
    --hair:rgba(255,255,255,0.30);
    --hair-dim:rgba(255,255,255,0.16);
    --hair-bright:rgba(255,255,255,0.62);
    --label:rgba(255,255,255,0.44);
    --label-strong:rgba(255,255,255,0.72);
  }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../../logo/bonk-mark-sup.js"></script>
<script>
/**
 * bonk.dj — superscript lockup, motion study. Two registers, one geometry.
 *
 *   ?mode=blueprint   (default) construction -> measurement -> resolve, 8.7s
 *   ?mode=watermark   the mark as a bug: faint, drifting, 12s seamless loop
 *
 * What makes this lockup different from the canonical one, and therefore what
 * this piece actually has to show:
 *
 *   - TWO TIERS. d is compound: a 4-glyph word plus a 2-glyph superscript that
 *     can take its own colour. Every fill in here is drawn as two paths so the
 *     tiers never collapse into one silhouette.
 *   - the superscript is TOP-ALIGNED to the ascender line (+1.0 units), not
 *     raised to some arbitrary superscript offset. It is not floating: it
 *     OVERLAPS the k's column by 25 units, and its descender clears the
 *     x-height line by 2.61. Those three numbers are the lockup's identity, so
 *     they are the dimensions this piece measures.
 *
 * Everything annotated is measured from the user's own SVG export (see
 * projects/blueprint/measure_sup.py). Nothing on screen is a placeholder figure:
 * the ink split is rasterised from the two tier paths at boot, and the sup
 * metrics come from the module.
 *
 * House rules (bonk design.md): jet black canvas, accent only, mono hairlines,
 * no gradients, no noise, subtle drift. The watermark register is the same
 * surface, quieter -- alpha and drift, nothing added.
 *
 * renderAt(t) is a pure function of t; the rAF loop calls it for preview and the
 * capture harness calls __seek(t), so the GIF is frame-identical to playback.
 */

let ACCENT       = '#8fb3a9';
let ACCENT_2     = '#b0a0d0';
let ACCENT_SOFT  = '#cfe3dd';
let ACCENT_GLOW  = 'rgba(143,179,169,0.32)';
let HAIR         = 'rgba(255,255,255,0.30)';
let HAIR_DIM     = 'rgba(255,255,255,0.16)';
let HAIR_BRIGHT  = 'rgba(255,255,255,0.62)';
let LABEL        = 'rgba(255,255,255,0.44)';
let LABEL_STRONG = 'rgba(255,255,255,0.72)';
let GROUND       = '#0b0b0b';

function applyTheme(){
  const cs = getComputedStyle(document.documentElement);
  const g = (n, f) => (cs.getPropertyValue(n).trim() || f);
  ACCENT       = g('--accent', ACCENT);
  ACCENT_2     = g('--accent-2', ACCENT_2);
  ACCENT_SOFT  = g('--accent-soft', ACCENT_SOFT);
  ACCENT_GLOW  = g('--accent-glow', ACCENT_GLOW);
  HAIR         = g('--hair', HAIR);
  HAIR_DIM     = g('--hair-dim', HAIR_DIM);
  HAIR_BRIGHT  = g('--hair-bright', HAIR_BRIGHT);
  LABEL        = g('--label', LABEL);
  LABEL_STRONG = g('--label-strong', LABEL_STRONG);
  GROUND       = g('--ground', GROUND);
}
/* Re-reads the variables AND repaints: __seek() cancels the rAF loop, so without
   an explicit renderAt() the canvas keeps the old frame while __theme() reports
   the new colour -- "reads correct, renders stale". */
function applyThemeAndRedraw(){ applyTheme(); renderAt(lastT); }
window.__applyTheme = applyThemeAndRedraw;
window.__theme = () => ({ ground: GROUND, accent: ACCENT, accent2: ACCENT_2, accentSoft: ACCENT_SOFT });

applyTheme();

const params    = new URLSearchParams(location.search);
const DEBUG     = params.has('debug');
const MODE      = (params.get('mode') || 'blueprint').toLowerCase();
const IS_WM     = MODE === 'watermark';
const DURATION  = IS_WM ? 12.0 : 8.7;
/* ?ghost=0 forces the watermark's blueprint ghost off. It exists so the ghost can
   be verified by isolation: the same timestamp rendered with and without it makes
   the drift identical, so the difference between the two frames IS the ghost. Any
   fixed-region test instead has to guess where the mark has drifted to. */
const GHOST_FORCE = params.has('ghost') ? parseFloat(params.get('ghost')) : -1;

/* ── easing ─────────────────────────────────────────────────────────────── */
const clamp01 = (t) => (t < 0 ? 0 : t > 1 ? 1 : t);
const expoOut = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
const cubicOut = (t) => 1 - Math.pow(1 - t, 3);
const cubicInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const inOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const sineInOut = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const win = (t, a, b) => clamp01((t - a) / (b - a));
const fmt = (n) => (Math.round(n * 10) / 10).toFixed(1);
/** a raised-cosine bump: 0 at 0, 1 at 0.5, 0 at 1. For pulses that must not clip. */
const bump = (p) => (p <= 0 || p >= 1 ? 0 : Math.sin(Math.PI * p) ** 2);

/* ── timeline (seconds), blueprint register ─────────────────────────────── */
/* The canonical-lockup blueprint resolved 6 glyphs from one word. Here the
   superscript gets its own beat AFTER the word lands, because that is the order
   the lockup reads in: word, then the small dj tucked over the k. */
const T = {
  seedEnd: 0.70,
  capLine: [0.35, 0.75],
  baseLine: [0.42, 0.82],
  cross: [0.55, 0.95],
  letterRules: [0.70, 0.26],
  ruler: [0.95, 1.95],
  dimTop: [1.25, 1.75],
  dimLeft: [1.35, 1.85],
  anchors: [1.50, 1.80],
  labels: [1.25, 2.25],
  /* the superscript's own construction beat: its band, its alignment, its overlap */
  supBand: [2.20, 2.85],
  supAlign: [2.35, 3.00],
  supOverlap: [2.50, 3.15],
  trace: [1.95, 2.55],
  resolve: [2.55, 0.30],
  resolveStagger: 0.054,
  beat: 3.12,                  // the word has resolved here
  supResolve: 3.30,            // ...and now the dj lands, on its own beat
  supResolveStagger: 0.07,
  rulesOut: [3.40, 4.10],

  /* Construction furniture that reads as lines OVER the finished artwork retracts as
     the mark lands. The seeded ring, the centre cross and the centre circle used to sit
     at partial alpha on top of the resolved mark for another ~2s (they carried only
     guideAlpha, which is tied to dimsAway) -- seeded geometry that never leaves. Only
     the LABELLED dimensions wait for dimsAway. */
  furnitureOut: [3.25, 4.00],
  dimsAway: [4.45, 5.25],
  push: [4.45, 5.95],
  waveform: [4.65, 5.95],
  hold: [5.95, 7.55],
  sweep: [7.55, 8.10],
  fade: [7.85, 8.35],
  seedReturn: 8.30,
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const MARK = window.BONK_MARK_SUP;
const M = MARK.metrics;
const glyphs = MARK.letters.length;

/* ── ink split between the two tiers, measured not asserted ──────────────── */
/* Rasterised once at boot at 1:1 mark units. If dMain and dSup ever fail to
   partition the artwork this number goes wrong on screen. */
const TIERS = (() => {
  const cv = document.createElement('canvas');
  cv.width = Math.round(MARK.width); cv.height = Math.round(MARK.height);
  const cx = cv.getContext('2d', { willReadFrequently: true });
  const count = (d) => {
    cx.clearRect(0, 0, cv.width, cv.height);
    cx.fillStyle = '#fff';
    cx.fill(new Path2D(d));
    const px = cx.getImageData(0, 0, cv.width, cv.height).data;
    let n = 0;
    for (let i = 3; i < px.length; i += 4) if (px[i] > 127) n++;
    return n;
  };
  const main = count(MARK.dMain), sup = count(MARK.dSup);
  const total = main + sup || 1;
  return { mainPx: main, supPx: sup, mainPct: (main / total) * 100, supPct: (sup / total) * 100 };
})();

/* ── geometry ───────────────────────────────────────────────────────────── */
let W = 0, H = 0, dpr = 1, ox = 0, oy = 0, s = 1;
let pathMain = null, pathSup = null;
let outline = [], totalOutline = 0, letterU = 0;

/* screen-space y for a mark-space y */
const Y = (my) => oy + my * s;
const u = (n) => n * (H / 1080);

function layout() {
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  /* Budget from the data block's position, as in the canonical blueprint: the
     mark is centred at W*0.455 and the block sits at W*0.845, so the widest the
     mark can go while keeping clearance is 2*(0.845-0.455-0.06) = 0.66. This
     lockup is 3.28:1 -- wider and shorter than the canonical 2.39:1 -- so it is
     width-limited at every aspect ratio and 0.60 keeps it off the block. */
  const targetW = Math.min(W * 0.60, (H * 0.62) * (MARK.width / MARK.height));
  s = targetW / MARK.width;
  const mh = MARK.height * s;
  ox = W * 0.455 - targetW / 2;
  oy = H * 0.50 - mh / 2;

  const org = MARK.origin || { x: 0, y: 0 };
  const m = new DOMMatrix().translate(ox - org.x * s, oy - org.y * s).scale(s, s);
  pathMain = new Path2D(); pathMain.addPath(new Path2D(MARK.dMain), m);
  pathSup  = new Path2D(); pathSup.addPath(new Path2D(MARK.dSup), m);

  outline = splitSubpaths(MARK.d).map((d) => samplePath(d, m)).filter((p) => p.length > 1);
  outline.forEach((seg) => {
    let len = 0;
    for (let i = 1; i < seg.length; i++) len += Math.hypot(seg[i].x - seg[i - 1].x, seg[i].y - seg[i - 1].y);
    seg.len = len;
  });
  outline.sort((a, b) => minX(a) - minX(b));
  totalOutline = outline.reduce((n, seg) => n + seg.len, 0) || 1;

  letterU = MARK.letters.map((l) => ({ x0: ox + l.x0 * s, x1: ox + l.x1 * s,
                                       y0: Y(l.y0), y1: Y(l.y1), glyph: l.glyph }));
}
const minX = (seg) => seg.reduce((v, p) => Math.min(v, p.x), Infinity);

function splitSubpaths(d) {
  const out = [];
  for (const part of d.split(/(?=M )/)) if (part.trim().startsWith('M')) out.push(part.trim());
  return out;
}

const sampleSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
sampleSvg.setAttribute('width', '0'); sampleSvg.setAttribute('height', '0');
sampleSvg.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none';
document.body.appendChild(sampleSvg);

/** Sample a path into a screen-space polyline (needed for the traced-on contour). */
function samplePath(d, matrix) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d);
  sampleSvg.appendChild(p);
  const total = p.getTotalLength();
  const steps = Math.max(24, Math.round(total / 2.5));
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const pt = p.getPointAtLength((i / steps) * total);
    const v = new DOMPoint(pt.x, pt.y).matrixTransform(matrix);
    pts.push({ x: v.x, y: v.y });
  }
  p.remove();
  return pts;
}

/* ── drawing helpers ────────────────────────────────────────────────────── */
function hair(x1, y1, x2, y2, color, w) {
  ctx.strokeStyle = color; ctx.lineWidth = w || 1;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
/** Horizontal rule growing out from its centre. */
function hairCentre(y, x1, x2, p, color, w) {
  const cx = (x1 + x2) / 2, h = ((x2 - x1) / 2) * expoOut(p);
  hair(cx - h, y, cx + h, y, color, w);
}
/** Vertical rule growing out from its centre. */
function hairCentreV(x, y1, y2, p, color, w) {
  const cy = (y1 + y2) / 2, h = ((y2 - y1) / 2) * expoOut(p);
  hair(x, cy - h, x, cy + h, color, w);
}
function mono(size, weight) {
  ctx.font = `${weight || 400} ${size}px 'IBM Plex Mono Bonk', ui-monospace, monospace`;
}
function text(str, x, y, color, size, align, weight) {
  mono(size || 12, weight);
  ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(str, x, y);
}
/** Vertical text, rotated about its own centre. */
function textV(str, x, y, color, size, weight) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-Math.PI / 2);
  text(str, 0, 0, color, size, 'center', weight); ctx.restore();
}
/** Draw the first p fraction of a polyline, skipping anything left of `front`. */
function strokePartial(seg, p, front) {
  const target = seg.len * p;
  ctx.beginPath();
  let acc = 0, started = false;
  for (let i = 0; i < seg.length; i++) {
    const pt = seg[i];
    if (i > 0) acc += Math.hypot(pt.x - seg[i - 1].x, pt.y - seg[i - 1].y);
    if (acc > target) break;
    if (pt.x < front) { started = false; continue; }
    if (!started) { ctx.moveTo(pt.x, pt.y); started = true; }
    else ctx.lineTo(pt.x, pt.y);
  }
  ctx.stroke();
}
/** Both tier paths, filled. Kept as one call so a tier can never be forgotten. */
function fillTiers(aMain, aSup) {
  ctx.globalAlpha = aMain; ctx.fillStyle = ACCENT; ctx.fill(pathMain);
  ctx.globalAlpha = aSup;  ctx.fillStyle = ACCENT_2; ctx.fill(pathSup);
  ctx.globalAlpha = 1;
}

/* ── shared furniture ───────────────────────────────────────────────────── */
/** The mark's construction lines: ascender, x-height, baseline + centre cross. */
function drawGuides(a, top, bot, p, pCross) {
  ctx.globalAlpha = a;
  hairCentre(top, ox - u(42), ox + MARK.width * s + u(42), p, HAIR, 1);
  hairCentre(bot, ox - u(42), ox + MARK.width * s + u(42), p, HAIR, 1);
  ctx.globalAlpha = 1;
  if (pCross > 0) {
    const cxm = ox + (MARK.width * s) / 2, cym = (top + bot) / 2, e = expoOut(pCross);
    ctx.globalAlpha = 0.85 * a;
    hair(cxm - u(52) * e, cym + 0.5, cxm + u(52) * e, cym + 0.5, HAIR_DIM, 1);
    hair(cxm + 0.5, cym - u(52) * e, cxm + 0.5, cym + u(52) * e, HAIR_DIM, 1);
    ctx.globalAlpha = 1;
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   REGISTER 1 — BLUEPRINT
   ═══════════════════════════════════════════════════════════════════════════ */
function renderBlueprint(t) {
  const top = oy, bot = oy + MARK.height * s;
  const left = ox, right = ox + MARK.width * s;
  const mkCx = (left + right) / 2, mkCy = (top + bot) / 2;
  const xHeight = M.xHeight, strokeWidth = M.stemWidth;

  const guidesOut = win(t, T.dimsAway[0], T.dimsAway[1]);
  const guideAlpha = 1 - guidesOut;
  /* furniture retracts on the mark's landing, independently of the labelled dimensions */
  const furnAlpha = 1 - win(t, T.furnitureOut[0], T.furnitureOut[1]);

  /* the push-in affects the mark and its furniture, about the mark centre */
  const pushP = win(t, T.push[0], T.push[1]);
  let zoom = 1 + 0.032 * cubicInOut(pushP);
  if (t > T.hold[0]) zoom = 1.032 + 0.004 * inOut(win(t, T.hold[0], T.hold[1]));

  ctx.save();
  ctx.translate(W * 0.455, H * 0.50);
  ctx.scale(zoom, zoom);
  ctx.translate(-W * 0.455, -H * 0.50);

  /* ── 1. seed ── */
  if (t < T.seedEnd) {
    const p = win(t, 0, T.seedEnd);
    const r = u(4) + u(5) * expoOut(p);
    ctx.globalAlpha = 0.32 * (1 - clamp01((t - 0.15) / 0.55));
    ctx.strokeStyle = HAIR_BRIGHT; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(right, mkCy, u(30) + u(300) * expoOut(clamp01((t - 0.12) / 0.78)), 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = ACCENT;
    ctx.beginPath(); ctx.arc(mkCx, mkCy, r, 0, Math.PI * 2); ctx.fill();
  }

  /* ── 2. construction: three horizontal planes ── */
  drawGuides(guideAlpha * furnAlpha, top, bot, win(t, T.capLine[0], T.capLine[1]), win(t, T.cross[0], T.cross[1]));
  if (t >= T.cross[0]) {
    const rp = expoOut(win(t, T.cross[0] + 0.08, T.cross[1] + 0.10));
    ctx.globalAlpha = 0.5 * guideAlpha * furnAlpha;
    ctx.strokeStyle = HAIR; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(mkCx, mkCy, u(44) * rp, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  /* x-height plane in accent: it is the metric that governs a lowercase mark, and
     the superscript descender crosses it -- which is exactly what to look at here. */
  if (t >= T.capLine[0] + 0.1) {
    const yx = Y(M.baseline - xHeight);
    ctx.globalAlpha = 0.55 * guideAlpha * furnAlpha;
    hairCentre(yx, left - u(30), right + u(30), win(t, T.capLine[0] + 0.1, T.capLine[1] + 0.15), ACCENT, 1);
    ctx.globalAlpha = guideAlpha * furnAlpha;
    text('X', left - u(34), yx + u(4), ACCENT_SOFT, u(10), 'right', 600);
    ctx.globalAlpha = 1;
  }

  /* letter column rules */
  const rulesOut = win(t, T.rulesOut[0], T.rulesOut[1]);
  const ruleAlpha = (1 - 0.82 * guidesOut) * (1 - rulesOut);
  MARK.letters.forEach((l, i) => {
    const st = T.letterRules[0] + i * T.letterRules[1];
    const p = win(t, st, st + 0.34);
    if (p <= 0 || ruleAlpha < 0.01) return;
    const h = (MARK.height / 2 + u(26)) * s * expoOut(p);
    [l.x0, l.x1].forEach((ux) => {
      const x = Math.round(ox + ux * s) + 0.5;
      ctx.globalAlpha = 0.5 * ruleAlpha;
      hair(x, mkCy - h, x, mkCy + h, HAIR_DIM, 1);
    });
    ctx.globalAlpha = 1;
  });

  /* corner anchors */
  if (t >= T.anchors[0]) {
    const p = expoOut(win(t, T.anchors[0], T.anchors[1]));
    ctx.globalAlpha = guideAlpha;
    const hh = u(3.4) * p;
    [[left, top], [right, top], [left, bot], [right, bot]].forEach(([x, y]) => {
      ctx.fillStyle = guidesOut > 0.5 ? LABEL : ACCENT;
      ctx.fillRect(x - hh, y - hh, hh * 2, hh * 2);
    });
    ctx.globalAlpha = 1;
  }

  /* ── 3. ruler + the mark's own ink profile ── */
  const rulerY = bot + u(30);
  const waveP = win(t, T.waveform[0], T.waveform[1]);
  if (t >= T.ruler[0]) {
    const unitStep = 10, tall = 50;
    for (let ux = 0; ux <= MARK.width; ux += unitStep) {
      const p = expoOut(win(t, T.ruler[0] + (ux / MARK.width) * (T.ruler[1] - T.ruler[0]) * 0.55, T.ruler[1]));
      if (p <= 0) continue;
      const isTall = ux % tall === 0;
      const x = Math.round(ox + ux * s) + 0.5;
      const bucket = Math.min(MARK.profile.length - 1, Math.round((ux / MARK.width) * (MARK.profile.length - 1)));
      const barH = u(6 + (MARK.profile[bucket] / 207) * 58) * p;
      const h = lerp(u(isTall ? 9 : 5) * p, barH, waveP);
      ctx.globalAlpha = lerp(0.5, 0.9, waveP) * (1 - 0.6 * guidesOut);
      hair(x, rulerY, x, rulerY + h, isTall ? HAIR_BRIGHT : HAIR, 1);
    }
    ctx.globalAlpha = 1;
    if (waveP < 0.6) {
      ctx.globalAlpha = (1 - waveP / 0.6) * guideAlpha;
      for (let ux = 0; ux <= MARK.width; ux += tall) {
        text(String(ux), ox + ux * s, rulerY + u(24), LABEL, u(11), ux === 0 ? 'left' : 'center');
      }
      ctx.globalAlpha = 1;
    }
  }

  /* ── 4. dimensions ── */
  if (t >= T.dimTop[0]) {
    const p = win(t, T.dimTop[0], T.dimTop[1]), e = expoOut(p);
    const y = top - u(64), half = (MARK.width * s * e) / 2;
    ctx.globalAlpha = guideAlpha;
    hair(mkCx - half, y + 0.5, mkCx + half, y + 0.5, HAIR, 1);
    [-half, half].forEach((dx) => hair(mkCx + dx + 0.5, y - u(7), mkCx + dx + 0.5, y + u(7), HAIR, 1));
    if (p > 0.85) text(fmt(MARK.width), mkCx, y - u(12), ACCENT_SOFT, u(13), 'center', 600);
    ctx.globalAlpha = 1;
  }
  if (t >= T.dimLeft[0]) {
    const p = win(t, T.dimLeft[0], T.dimLeft[1]), e = expoOut(p);
    const x = left - u(64), half = (MARK.height * s * e) / 2;
    ctx.globalAlpha = guideAlpha;
    hair(x + 0.5, mkCy - half, x + 0.5, mkCy + half, HAIR, 1);
    [-half, half].forEach((dy) => hair(x - u(7), mkCy + dy + 0.5, x + u(7), mkCy + dy + 0.5, HAIR, 1));
    if (p > 0.85) textV(fmt(MARK.height), x - u(14), mkCy, ACCENT_SOFT, u(13), 600);
    ctx.globalAlpha = 1;
  }
  /* nested x-height dimension */
  if (t >= T.dimLeft[0] + 0.25 && guidesOut < 0.9) {
    const p = expoOut(win(t, T.dimLeft[0] + 0.25, T.dimLeft[1] + 0.25));
    const x = left - u(24), yb = Y(M.baseline), yx = yb - xHeight * s;
    ctx.globalAlpha = guideAlpha;
    hair(x + 0.5, yx, x + 0.5, yb, ACCENT_SOFT, 1);
    [yx, yb].forEach((y) => hair(x - u(6), y + 0.5, x + u(6), y + 0.5, ACCENT_SOFT, 1));
    if (p > 0.85) text(fmt(xHeight), x - u(11), (yb + yx) / 2, ACCENT_SOFT, u(12), 'right', 600);
    ctx.globalAlpha = 1;
  }
  /* stroke width across the first stem */
  if (t >= T.labels[0] + 0.3 && guidesOut < 0.9) {
    const y = bot + u(86);
    const x0 = ox, x1 = ox + strokeWidth * s;
    ctx.globalAlpha = guideAlpha;
    [x0, x1].forEach((x) => hair(x + 0.5, y - u(7), x + 0.5, y + u(7), HAIR, 1));
    hair(x0, y + 0.5, x1, y + 0.5, HAIR, 1);
    text(fmt(strokeWidth), (x0 + x1) / 2, y + u(20), ACCENT_SOFT, u(12), 'center', 600);
    ctx.globalAlpha = 1;
  }

  /* ── 5. THE SUPERSCRIPT: the three numbers that define this lockup ─────── */
  /* (a) its band, dimensioned against the right edge — sup top to j descender */
  if (t >= T.supBand[0] && guidesOut < 0.9) {
    const p = expoOut(win(t, T.supBand[0], T.supBand[1]));
    const x = right + u(30);
    const yTop = Y(M.supTop), yBot = Y(MARK.letters[5].y1), yD = Y(MARK.letters[4].y1);
    const h = ((yBot - yTop) / 2) * p, cy = (yTop + yBot) / 2;
    ctx.globalAlpha = guideAlpha * furnAlpha;
    hair(x + 0.5, cy - h, x + 0.5, cy + h, ACCENT_2, 1);
    [yTop, yBot].forEach((y) => hair(x - u(7), y + 0.5, x + u(7), y + 0.5, ACCENT_2, 1));
    /* the inner tick marks where the d stops and the j's descender carries on */
    hair(x - u(5), yD + 0.5, x + u(5), yD + 0.5, ACCENT_2, 1);
    if (p > 0.85) {
      textV(fmt(yBot - yTop) + ' SUP', x + u(15), cy, ACCENT_2, u(11), 600);
      text('D', x + u(11), yD + u(4), ACCENT_2, u(9), 'left', 600);
    }
    ctx.globalAlpha = 1;
  }
  /* (b) top alignment: the sup sits +1.0 off the ascender line, so draw the
         offset rather than claiming it is flush */
  if (t >= T.supAlign[0] && guidesOut < 0.9) {
    const p = win(t, T.supAlign[0], T.supAlign[1]), e = expoOut(p);
    const ySup = Y(M.supTop), xSup = ox + M.supX0 * s;
    const x0 = xSup - u(74) * e;
    ctx.globalAlpha = guideAlpha * furnAlpha;
    hair(x0 + 0.5, ySup + 0.5, xSup + 0.5, ySup + 0.5, ACCENT_2, 1.4);
    ctx.globalAlpha = guideAlpha * 0.7;
    hair(x0 + 0.5, top + 0.5, xSup + 0.5, top + 0.5, HAIR_DIM, 1);
    ctx.globalAlpha = guideAlpha;
    hair(x0 + 0.5, top, x0 + 0.5, ySup, ACCENT_2, 1);
    if (p > 0.7) text('+' + fmt(M.supTop), x0 - u(8), (top + ySup) / 2 + u(4), ACCENT_2, u(11), 'right', 600);
    ctx.globalAlpha = 1;
  }
  /* (c) the overlap: the dj is not floating to the right of the k, it is nested
         over it. 25 units of shared column, bracketed where they meet. */
  if (t >= T.supOverlap[0] && guidesOut < 0.9) {
    const p = win(t, T.supOverlap[0], T.supOverlap[1]), e = expoOut(p);
    const xL = ox + M.supX0 * s, xR = ox + M.mainX1 * s;
    const yB = Y(MARK.letters[5].y1) + u(34);
    ctx.globalAlpha = guideAlpha * furnAlpha;
    [xL, xR].forEach((x) => hair(x + 0.5, yB - u(6), x + 0.5, yB + u(6), ACCENT_2, 1));
    hair(xL, yB + 0.5, lerp(xL, xR, e), yB + 0.5, ACCENT_2, 1);
    if (p > 0.8) text(fmt(xR - xL) + ' OVERLAP', (xL + xR) / 2, yB + u(19), ACCENT_2, u(11), 'center', 600);
    ctx.globalAlpha = 1;
  }

  /* ── 6. the mark: contour traced, then resolved per glyph ── */
  const traceP = win(t, T.trace[0], T.trace[1]);
  const perLetter = MARK.letters.map((l, i) => {
    const st = i < 4 ? T.resolve[0] + i * T.resolveStagger
                     : T.supResolve + (i - 4) * T.supResolveStagger;
    return cubicOut(win(t, st, st + (i < 4 ? T.resolve[1] : 0.34)));
  });
  const anyResolving = perLetter.some((p) => p > 0);

  if (t >= T.trace[0] && t < T.sweep[1]) {
    const fadeOut = win(t, T.fade[0], T.fade[1]);
    ctx.globalAlpha = 1 - fadeOut;

    if (anyResolving) {
      ctx.save();
      ctx.beginPath();
      letterU.forEach((w, i) => {
        const p = perLetter[i];
        if (p <= 0) return;
        ctx.rect(w.x0, top - u(40), (w.x1 - w.x0) * p, (bot - top) + u(80));
      });
      ctx.clip();
      ctx.shadowColor = ACCENT_GLOW;
      ctx.shadowBlur = u(28) * clamp01((t - T.beat) / 1.2);
      fillTiers(1, 1);
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    ctx.strokeStyle = HAIR_BRIGHT;
    ctx.lineWidth = 1.4;
    let cum = 0;
    outline.forEach((seg) => {
      const share = seg.len / totalOutline;
      const segStart = (cum / totalOutline) * 0.85;
      cum += seg.len;
      const local = clamp01((traceP - segStart) / Math.max(0.08, share));
      if (local <= 0) return;
      const segLeft = minX(seg);
      const segRight = Math.max(...seg.map((p) => p.x));
      const li = letterU.findIndex((w) => segLeft >= w.x0 - 2 && segRight <= w.x1 + 2);
      const front = li >= 0 ? lerp(letterU[li].x0, letterU[li].x1, perLetter[li]) : Infinity;
      strokePartial(seg, local, front);
    });
    ctx.globalAlpha = 1;
  }

  /* leading edge of each active wipe */
  letterU.forEach((w, i) => {
    const p = perLetter[i];
    if (p <= 0.001 || p >= 0.999) return;
    const x = Math.round(lerp(w.x0, w.x1, p)) + 0.5;
    ctx.globalAlpha = 0.9 * (1 - win(t, T.sweep[0], T.sweep[1]));
    hair(x, top - u(16), x, bot + u(16), i >= 4 ? ACCENT_2 : ACCENT_SOFT, 1);
    ctx.globalAlpha = 1;
  });

  ctx.restore();

  /* ── 7. data block ── */
  const blockX = W * 0.845, blockY = H * 0.215;
  const blockA = win(t, T.labels[0], T.labels[1]) * (1 - win(t, T.sweep[0], T.sweep[1]));
  if (blockA > 0.01) {
    const rows = [
      ['bonk dj / SUPERSCRIPT', ACCENT, 13, 600],
      ['SVG EXPORT · TOP-ALIGNED dj', LABEL, 11, 400],
      ['TWO-TIER MARK', LABEL, 11, 400],
      ['', null, 0, 0],
      [`W ${fmt(MARK.width)}`, null, 12, 400],
      [`H ${fmt(MARK.height)}`, null, 12, 400],
      [`X-HEIGHT ${fmt(xHeight)}`, null, 12, 400],
      [`ASCENDER ${fmt(M.ascender)}`, null, 12, 400],
      [`STROKE ${fmt(strokeWidth)}`, null, 12, 400],
      [`GLYPHS ${glyphs} ${MARK.letters.map((l) => l.glyph).join(' ')}`, null, 12, 400],
      ['', null, 0, 0],
      [`SUP TOP +${fmt(M.supTop)}`, ACCENT_2, 12, 600],
      [`SUP OVERLAP ${fmt(M.mainX1 - M.supX0)}`, ACCENT_2, 12, 600],
      [`SUP SPAN ${fmt(MARK.letters[5].y1 - M.supTop)}`, ACCENT_2, 12, 600],
      [`DESCENDER +${fmt(MARK.letters[5].y1 - (M.baseline - xHeight))}`, ACCENT_2, 12, 600],
      [`SUP SCALE ${(MARK.letters[4].y1 / M.ascender * 100).toFixed(1)}%`, ACCENT_2, 12, 600],
      ['', null, 0, 0],
      [`INK ${M.inkCoveragePct.toFixed(1)}%`, null, 12, 400],
      [`  WORD ${TIERS.mainPct.toFixed(1)}%`, ACCENT, 12, 600],
      [`  DJ ${TIERS.supPct.toFixed(1)}%`, ACCENT_2, 12, 600],
      ['', null, 0, 0],
    ];
    ctx.globalAlpha = blockA;
    let y = blockY;
    rows.forEach(([str, col, size, wt]) => {
      if (str) text(str, blockX, y, col || LABEL_STRONG, u(size), 'left', wt);
      y += u(size + 10);
    });
    /* per-glyph column windows, revealed in sequence with the fill */
    y += u(6);
    MARK.letters.forEach((l, i) => {
      const st = i < 4 ? T.labels[0] + 0.35 + i * 0.12 : T.supResolve + (i - 4) * T.supResolveStagger;
      const p = clamp01((t - st) / 0.4);
      if (p <= 0) return;
      const size = u(11);
      y += u(18);
      const on = perLetter[i] > 0.5;
      ctx.globalAlpha = blockA * p;
      ctx.fillStyle = i >= 4 ? ACCENT_2 : (on ? ACCENT : LABEL);
      ctx.fillRect(blockX, y - size, u(4) * p, u(6));
      text(l.glyph.toUpperCase(), blockX + u(12), y, i >= 4 ? ACCENT_2 : 'rgba(255,255,255,0.55)', size);
      text(fmt(l.w), blockX + u(48), y, on ? ACCENT_SOFT : LABEL_STRONG, size);
      const barW = u(112) * (l.w / Math.max(...MARK.letters.map((q) => q.w)));
      ctx.globalAlpha = blockA * p * 0.5;
      hair(blockX + u(92), y - size * 0.35, blockX + u(92) + barW * p, y - size * 0.35, HAIR_BRIGHT, 1);
    });
    ctx.globalAlpha = 1;
  }

  /* ── 8. outro: sweep erases, the seed returns (seamless loop) ── */
  if (t >= T.sweep[0]) {
    const p = cubicOut(win(t, T.sweep[0], T.sweep[1]));
    const x = Math.round(lerp(left - u(60), right + u(60), p)) + 0.5;
    ctx.globalAlpha = 0.9 * (1 - clamp01((p - 0.85) / 0.15));
    hair(x, top - u(60), x, bot + u(70), ACCENT_SOFT, 1);
    ctx.globalAlpha = 1;
  }
  if (t >= T.seedReturn) {
    const p = win(t, T.seedReturn, DURATION);
    ctx.fillStyle = ACCENT;
    ctx.beginPath(); ctx.arc(mkCx, mkCy, u(4) + u(5) * expoOut(p), 0, Math.PI * 2); ctx.fill();
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   REGISTER 2 — WATERMARK
   The same mark as a background bug: faint, always drifting, never a hero.
   No new material is introduced to "make it a watermark" -- alpha and drift do
   all of it, which is what keeps it on the same surface as the blueprint.
   ═══════════════════════════════════════════════════════════════════════════ */
function renderWatermark(t) {
  const p = t / DURATION;                    // 0..1 over the loop
  const top = oy, bot = oy + MARK.height * s;
  const left = ox, right = ox + MARK.width * s;
  const mkCx = (left + right) / 2, mkCy = (top + bot) / 2;

  /* drift: two incommensurate-in-phase sines so the loop closes cleanly but the
     path never retraces the same line. Scale breathes rather than pulses.
     Amplitudes measured, not guessed: at 9/6 px and a 1.4% breathe the
     quarter-to-three-quarter span came to 1.688 mean luma, i.e. motion that reads
     as a still frame. A watermark still has to MOVE -- these give ~2.5x that. */
  const dx = Math.sin(p * Math.PI * 2) * u(16);
  const dy = Math.cos(p * Math.PI * 2) * u(11) - Math.sin(p * Math.PI * 4) * u(3);
  const breathe = 1 + 0.022 * sineInOut(0.5 + 0.5 * Math.sin(p * Math.PI * 2));

  ctx.save();
  ctx.translate(mkCx + dx, mkCy + dy);
  ctx.scale(breathe, breathe);
  ctx.translate(-mkCx, -mkCy);

  /* the tiers sit at deliberately different weights: the dj is the smaller,
     quieter mark, so it reads slightly stronger — that contrast is what keeps
     a 3.9%-of-ink detail legible at watermark alpha.
     Alpha is calibrated against the GROUND, not chosen by feel: on a near-black
     canvas 8.5% put the mark at 1.11:1, which measures as invisible. These give
     ~1.75:1 and ~2.33:1 — present, still clearly background. */
  fillTiers(0.30, 0.42);

  /* every loop, the blueprint ghosts through: hairlines and the superscript's
     alignment dims rise to a whisper and fall. This is the bridge between the
     two registers -- same construction language, at watermark strength. */
  const ghost = GHOST_FORCE === 0 ? 0 : bump((p - 0.55) / 0.34);
  if (ghost > 0.004) {
    ctx.globalAlpha = 0.24 * ghost;
    hairCentre(top, left - u(30), right + u(30), 1, HAIR_BRIGHT, 1);
    hairCentre(bot, left - u(30), right + u(30), 1, HAIR_BRIGHT, 1);
    const yx = Y(M.baseline - M.xHeight);
    ctx.globalAlpha = 0.30 * ghost;
    hairCentre(yx, left - u(20), right + u(20), 1, ACCENT, 1);
    ctx.globalAlpha = 0.40 * ghost;
    hair(left + M.supX0 * s, top, right, top, ACCENT_2, 1);
    hair(left + M.mainX1 * s, Y(M.supTop), left + M.mainX1 * s, Y(MARK.letters[5].y1), ACCENT_2, 1);
    ctx.globalAlpha = 1;
  }

  /* a slow registration tick: the corner anchors breathe in phase with nothing,
     which is what stops a looping watermark from reading as a metronome. */
  const reg = 0.5 + 0.5 * Math.sin(p * Math.PI * 2 * 3 - 1.1);
  ctx.globalAlpha = 0.10 + 0.10 * reg;
  const hh = u(3);
  [[left, top], [right, bot]].forEach(([x, y]) => { ctx.fillStyle = ACCENT; ctx.fillRect(x - hh, y - hh, hh * 2, hh * 2); });
  ctx.globalAlpha = 1;

  ctx.restore();

  /* corner label, the one bit of typography a watermark is allowed */
  const la = 0.44 + 0.10 * reg;
  ctx.globalAlpha = la;
  text('bonk dj', W - u(46), H - u(40), LABEL_STRONG, u(13), 'right', 600);
  text('SUPERSCRIPT', W - u(46), H - u(24), LABEL, u(10), 'right', 400);
  ctx.globalAlpha = 1;
}

/* ── scene ──────────────────────────────────────────────────────────────── */
let lastT = 0;
function renderAt(t) {
  lastT = t;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  if (IS_WM) renderWatermark(t); else renderBlueprint(t);
  if (DEBUG) text(`t=${t.toFixed(2)} ${MODE}`, u(18), u(32), 'rgba(0,255,133,0.8)', u(14));
}

/* ── runtime ────────────────────────────────────────────────────────────── */
let fixedT = params.has('t') ? parseFloat(params.get('t')) : null;
layout();
window.addEventListener('resize', () => { layout(); if (fixedT !== null) renderAt(fixedT); });

window.__seek = (t) => {
  /* stop the preview loop first, or rAF keeps drawing its own clock between the
     seek and the screenshot and captures mix seeked and live frames */
  fixedT = t;
  if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  renderAt(t);
};
window.__duration = DURATION;
window.__config = () => ({
  mode: MODE, duration: DURATION,
  markW: MARK.width, markH: MARK.height, glyphs,
  metrics: M, tiers: TIERS,
  accent: ACCENT, accent2: ACCENT_2, ground: GROUND,
  source: MARK.source,
});
window.__ready = (async () => {
  try { await document.fonts.load("400 12px 'IBM Plex Mono Bonk'"); } catch (e) {}
  try { await document.fonts.load("600 12px 'IBM Plex Mono Bonk'"); } catch (e) {}
  await document.fonts.ready;
  if (fixedT !== null) renderAt(fixedT);
  return true;
})();

let rafId = 0;
if (fixedT === null) {
  const t0 = performance.now();
  const loop = (now) => { renderAt(((now - t0) / 1000) % DURATION); rafId = requestAnimationFrame(loop); };
  rafId = requestAnimationFrame(loop);
} else {
  renderAt(fixedT);
}
</script>
</body>
</html>
