<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bonk — curves v2</title>
<style>
/* ── theme ─────────────────────────────────────────────────────────────────
   Every colour is a custom property. Brand rule: orange is the only colour on
   a brand surface. The light register is for surfaces that are not brand.
   ──────────────────────────────────────────────────────────────────────── */
:root{
  --ground:#000000;
  --curve:#ff6b1a;
  --curve-2:rgba(255,107,26,.72);
  --curve-3:rgba(255,107,26,.52);
  --grid:rgba(255,255,255,.26);
  --axis:rgba(255,255,255,.46);
  --tick:rgba(255,255,255,.22);
  --label:#ffffff;
  --label-dim:rgba(255,255,255,.52);
  --mark:#ffffff;
}
[data-ground="light"]{
  --ground:#f5f9e9;
  --curve:#1e555c;
  --curve-2:rgba(30,85,92,.74);
  --curve-3:rgba(30,85,92,.54);
  --grid:rgba(54,69,59,.30);
  --axis:rgba(54,69,59,.52);
  --tick:rgba(54,69,59,.24);
  --label:#36453b;
  --label-dim:rgba(89,104,105,.74);
  --mark:#1e555c;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--ground)}
body{overflow:hidden;height:100vh}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<link rel="stylesheet" href="../blueprint/public/fonts/bonk.css">
<script src="../logo/current/bonk-mark.js"></script>
<script>
/* ── curves v2 ─────────────────────────────────────────────────────────────
   From reference clip 05_fps-easing-diagrams (210 frames, 70 ms; 14.7 s at 2x).

   The one clip of the nine whose signature is a DRAW-ON:

     motion        ink RISES while the bounding box stays put: 3.429% -> peak
                   5.799% at phase 0.39 with no growth in extents. A stroke being
                   laid down, not a scale.
     ink min       0.161%  it first ERASES almost to nothing, then draws. So the
                   sequence is present -> cleared -> drawn on, not drawn from zero.
     components    17 -> 23 -> 1
                   ~17 separate pieces (axes, gridlines, ticks, labels), peaking at
                   23 mid-draw because write-on strokes are briefly more numerous
                   than the finished figure, ending as ONE connected element.
     bbox span     0.789   near full-bleed AND centre-weighted (radial -0.460), so
                   it is a large centred plot rather than a small one.
     orientation   37.0 LR / 28.4 diag / 17.1 TB
                   HORIZONTAL-dominant. V1 of this file got that wrong and
                   measured 50.1 TB: a large title dominated with vertical stems.
                   Type is therefore held small relative to the ruled lines, and
                   the opening headline carries a horizontal rule to match.
     delta         0.0226 mean / 0.0646 max   gentle, no burst.

   Ink calibration: the reference's figures are measured on a 320x180 downscale,
   so strokes thinner than ~10 px at 1080p blur out and under-report. The weights
   below are set to survive that, which is why they read heavy in isolation.

   The ending is the point: 17 pieces resolve to 1. The figure clears and leaves
   the wordmark, loaded from logo/current -- the canonical module generated from
   the asset -- never re-typeset.
   ──────────────────────────────────────────────────────────────────────── */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1;

const cssv = (n, f) => (getComputedStyle(document.documentElement)
  .getPropertyValue(n).trim() || f);

if (new URLSearchParams(location.search).get('ground') === 'light')
  document.documentElement.dataset.ground = 'light';

const CFG = { duration: 8.0 };

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.width  = Math.round(innerWidth  * dpr);
  H = cv.height = Math.round(innerHeight * dpr);
}
resize();
addEventListener('resize', () => { resize(); draw(window.__t || 0); });

const clamp01 = k => k < 0 ? 0 : k > 1 ? 1 : k;
const seg = (t, a, b) => clamp01((t - a) / (b - a));

const EASES = [
  {name:'expo-out',     fn:k => k <= 0 ? 0 : k >= 1 ? 1 : 1 - Math.pow(2, -10 * k)},
  {name:'power4-out',   fn:k => 1 - Math.pow(1 - k, 4)},
  {name:'in-out-cubic', fn:k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2},
];

const DUR = CFG.duration;
const T_CLEAR   = [0.10 * DUR, 0.20 * DUR];
const T_DRAW    = [0.20 * DUR, 0.45 * DUR];
const T_RESOLVE = [0.75 * DUR, 0.92 * DUR];

/* bbox span 0.789 is a fraction of frame AREA: W*0.886 x H*0.889 = 0.787. */
function plotBox(){
  const w = W * 0.886, h = H * 0.889;
  return {x: (W - w) / 2, y: (H - h) / 2, w, h};
}

function strokePath(pts, k, colour, width, alpha){
  const n = pts.length;
  const upto = Math.max(1, Math.floor(k * (n - 1)));
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i <= upto; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (k < 1 && upto < n - 1){
    const f = k * (n - 1) - upto;
    const [ax, ay] = pts[upto];
    const [bx, by] = pts[upto + 1] || pts[upto];
    ctx.lineTo(ax + (bx - ax) * f, ay + (by - ay) * f);
  }
  ctx.strokeStyle = colour;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.globalAlpha = alpha;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function draw(t){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = cssv('--ground', '#000');
  ctx.fillRect(0, 0, W, H);

  const curve  = cssv('--curve', '#ff6b1a');
  const curve2 = cssv('--curve-2', 'rgba(255,107,26,.72)');
  const curve3 = cssv('--curve-3', 'rgba(255,107,26,.52)');
  const grid   = cssv('--grid', 'rgba(255,255,255,.26)');
  const axis   = cssv('--axis', 'rgba(255,255,255,.46)');
  const tick   = cssv('--tick', 'rgba(255,255,255,.22)');
  const lab    = cssv('--label', '#fff');
  const labDim = cssv('--label-dim', 'rgba(255,255,255,.52)');
  const mark   = cssv('--mark', '#fff');

  const B = plotBox();
  const F = Math.min(W, H);
  const px = u => B.x + u * B.w;
  const py = v => B.y + (1 - v) * B.h;

  const out_ = seg(t, T_CLEAR[0], T_CLEAR[1]);
  const on   = t < T_DRAW[0] ? 0 : t < T_DRAW[1] ? seg(t, T_DRAW[0], T_DRAW[1]) : 1;
  const gone = seg(t, T_RESOLVE[0], T_RESOLVE[1]);
  const present = (1 - out_) * (1 - gone);
  const figure  = on * (1 - gone);

  /* ── opening title block, which then clears ──────────────────────────── */
  if (present > 0.01){
    ctx.globalAlpha = present;
    ctx.textAlign = 'center';
    ctx.font = `700 ${Math.round(F * 0.158)}px "Bonk","Bonk Display",system-ui`;
    ctx.fillStyle = lab;
    ctx.fillText('motion', W / 2, H * 0.52);
    // a horizontal rule under the headline: this is what keeps the opening
    // LR-dominant instead of letting vertical text stems take over
    ctx.fillStyle = axis;
    ctx.fillRect(W * 0.26, H * 0.56, W * 0.48, Math.max(3, F * 0.0062));
    ctx.font = `400 ${Math.round(F * 0.028)}px "Bonk",system-ui`;
    ctx.fillStyle = labDim;
    ctx.fillText('three easings', W / 2, H * 0.63);
    ctx.globalAlpha = 1;
  }

  /* ── the plot: gridlines, axes, then three curves drawn on ───────────── */
  if (figure > 0.01){
    const axK = clamp01(figure * 2.6);
    const lw  = Math.max(3, F * 0.0074);
    const glw = Math.max(2, F * 0.0042);
    const clw = Math.max(4, F * 0.0126);

    // horizontal gridlines carry the LR dominance
    ctx.globalAlpha = figure * 0.95;
    ctx.fillStyle = grid;
    for (let i = 0; i <= 4; i++){
      const v = i / 4;
      if (v > axK) continue;
      ctx.fillRect(px(0) - F * 0.012, py(v) - glw / 2, B.w + F * 0.024, glw);
    }
    ctx.globalAlpha = 1;

    strokePath([[px(0), py(0)], [px(1), py(0)]], axK, axis, lw, 1);
    strokePath([[px(0), py(0)], [px(0), py(1)]], axK, axis, lw, 1);

    ctx.globalAlpha = figure;
    ctx.fillStyle = tick;
    for (let i = 0; i <= 8; i++){
      const u = i / 8;
      if (u > axK) continue;
      ctx.fillRect(px(u) - glw / 2, py(0), glw, F * 0.016);
    }
    ctx.globalAlpha = 1;

    const N = 96;
    const colours = [curve, curve2, curve3];
    EASES.forEach((e, i) => {
      const k = clamp01((figure - 0.22 - i * 0.17) / 0.40);
      if (k <= 0) return;
      const pts = [];
      for (let j = 0; j <= N; j++){
        const u = j / N;
        pts.push([px(u), py(e.fn(u))]);
      }
      strokePath(pts, k, colours[i], clw, 1);

      if (k > 0.86){
        ctx.globalAlpha = clamp01((k - 0.86) / 0.14);
        ctx.font = `600 ${Math.round(F * 0.0226)}px "Bonk",system-ui`;
        ctx.fillStyle = i === 0 ? lab : labDim;
        ctx.textAlign = 'left';
        ctx.fillText(e.name, px(1) + F * 0.014, py(e.fn(1)) + F * 0.008);
        ctx.globalAlpha = 1;
      }

      // a marker rides the final curve once everything has settled
      if (on >= 1 && i === EASES.length - 1){
        const travel = clamp01((t - T_DRAW[1]) / (T_RESOLVE[0] - T_DRAW[1]));
        const u = (travel * 2) % 1;
        ctx.beginPath();
        ctx.arc(px(u), py(e.fn(u)), Math.max(4, F * 0.0113), 0, Math.PI * 2);
        ctx.fillStyle = curve;
        ctx.globalAlpha = 0.95 * figure;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    });
  }

  /* ── resolve: everything clears, ONE element is left ─────────────────── */
  const r = seg(t, T_RESOLVE[0], T_RESOLVE[1]);
  if (r > 0.01 && window.BONK_MARK){
    const M = window.BONK_MARK;
    const gw = F * 0.30, s = gw / M.width, gh = M.height * s;
    const gx = (W - gw) / 2, gy = (H - gh) / 2;
    ctx.globalAlpha = r;
    ctx.translate(gx, gy);
    ctx.scale(s, s);
    ctx.translate(-M.origin.x, -M.origin.y);
    ctx.fillStyle = mark;
    ctx.fill(new Path2D(M.d));
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;

    if (r > 0.55){
      ctx.globalAlpha = (r - 0.55) / 0.45;
      ctx.font = `600 ${Math.round(F * 0.0242)}px "Bonk",system-ui`;
      ctx.fillStyle = labDim;
      ctx.textAlign = 'center';
      ctx.fillText('bonk', W / 2, gy + gh + F * 0.055);
      ctx.globalAlpha = 1;
    }
  }
}

/* ── deterministic capture ───────────────────────────────────────────────── */
window.__duration = DUR;
window.__seek = s => { window.__t = s; draw(s); };
window.__ready = true;
draw(0);
</script>
</body>
</html>
