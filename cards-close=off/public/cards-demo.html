<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>design is how it works — cards-close=off</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0a0a0a;
      overflow: hidden;
      font-family: "Neue Montreal", "PP Neue Montreal", -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #root {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #hint {
      position: fixed;
      top: 12px;
      left: 12px;
      color: #666;
      font-size: 12px;
      z-index: 10;
      font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <div id="hint">design is how it works · hover tiles · add ?words=hello,world,foo to customize · rmm shows static bar</div>
  <div id="root"></div>

  <script>
    // ─── palette ──────────────────────────────────────────────
    const SWATCHES = [
      { bg: "#0a0a0a", fg: "#ffffff" },
      { bg: "#ff2e20", fg: "#0a0a0a" },
      { bg: "#f0c2f7", fg: "#0a0a0a" },
      { bg: "#22e58b", fg: "#0a0a0a" },
      { bg: "#7c4dff", fg: "#0a0a0a" },
      { bg: "#ffe14d", fg: "#0a0a0a" },
      { bg: "#18b6ff", fg: "#0a0a0a" },
      { bg: "#ff7a1a", fg: "#0a0a0a" },
      { bg: "#ff4fa3", fg: "#0a0a0a" },
    ];
    const DEFAULT_WORDS = ["design", "is", "how", "it", "works"];
    const INITIAL = [SWATCHES[0], SWATCHES[1], SWATCHES[2], SWATCHES[3], SWATCHES[4]];

    function randomSwatchAvoiding(used) {
      const free = SWATCHES.filter((s) => !used.includes(s));
      const pool = free.length > 0 ? free : SWATCHES;
      return pool[(Math.random() * pool.length) | 0];
    }

    // ─── measure ─────────────────────────────────────────────
    const REF_FS = 72;
    let _mc = null,
      _mctx = null;
    function getMeasureCanvas() {
      if (_mc) return { canvas: _mc, ctx: _mctx };
      _mc = document.createElement("canvas");
      _mc.width = 1;
      _mc.height = 1;
      _mctx = _mc.getContext("2d", { willReadFrequently: true });
      return { canvas: _mc, ctx: _mctx };
    }

    function measureWord(word, fontFamily, fontWeight) {
      const { ctx } = getMeasureCanvas();
      ctx.font = fontWeight + " " + REF_FS + "px " + fontFamily;
      ctx.textBaseline = "alphabetic";
      const full = ctx.measureText(word);
      const fm = full.fontBoundingBoxAscent || REF_FS * 0.7;
      const fd = full.fontBoundingBoxDescent || REF_FS * 0.3;
      const glyphs = [];
      let x = 0;
      for (const ch of word) {
        const gm = ctx.measureText(ch);
        const ascent = gm.actualBoundingBoxAscent || fm;
        const descent = gm.actualBoundingBoxDescent || fd;
        glyphs.push({
          ch,
          x,
          y: -ascent,
          w: gm.width,
          h: ascent + descent,
          top: -ascent,
          bottom: descent,
        });
        x += gm.width;
      }
      return { width: full.width, glyphs, ascent: fm, descent: fd };
    }

    // ─── engine ──────────────────────────────────────────────
    const SVGNS = "http://www.w3.org/2000/svg";
    const FLY_STAGGER = 130;
    const FLY_MS = 760;
    const SHUFFLE_MIN = 1300;
    const SHUFFLE_MAX = 3200;
    const COLOR_MS = 520;
    const PAD_Y = 6;
    const PAD_X = 2;
    const BAND_ASCENT = 82;
    const BAND_DESCENT = 26;
    const BASELINE_Y = 0;
    const GAP = 7;

    function createDesignTiles(host, words) {
      const root = document.createElement("div");
      Object.assign(root.style, {
        position: "absolute",
        inset: "0",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        fontFamily:
          "var(--font-kyoto), var(--font-neue-montreal), -apple-system, BlinkMacSystemFont, sans-serif",
        userSelect: "none",
      });
      root.setAttribute("aria-label", words.join(" "));

      const fontFamily = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";

      const bar = document.createElement("div");
      Object.assign(bar.style, {
        display: "flex",
        alignItems: "center",
        columnGap: GAP + "px",
      });

      const tiles = [];
      let raf = 0;
      let running = false;
      let disposed = false;
      let revealed = false;
      let now = 0;

      words.forEach((word, i) => {
        const sw = INITIAL[i] ?? randomSwatchAvoiding([]);
        const outer = document.createElement("span");
        Object.assign(outer.style, {
          display: "grid",
          gridTemplateColumns: "0fr",
          transition: "grid-template-columns " +
            FLY_MS +
            "ms cubic-bezier(.16,1,.3,1)",
        });

        const clip = document.createElement("span");
        clip.style.overflow = "hidden";

        const svg = document.createElementNS(SVGNS, "svg");
        Object.assign(svg.style, {
          display: "block",
          width: "auto",
          height: "clamp(2.4rem, 6vw, 4rem)",
          opacity: "0",
          transition: "opacity " + Math.round(FLY_MS * 0.8) + "ms ease",
        });
        svg.setAttribute("viewBox", "0 0 100 100");

        const gBg = document.createElementNS(SVGNS, "g");
        const textEl = document.createElementNS(SVGNS, "text");
        textEl.setAttribute("font-family", fontFamily);
        textEl.setAttribute("font-weight", "500");
        textEl.setAttribute("font-size", String(REF_FS));
        textEl.setAttribute("dominant-baseline", "alphabetic");
        textEl.style.fill = sw.fg;
        textEl.style.transition = "fill " + COLOR_MS + "ms ease";
        textEl.textContent = word;

        svg.appendChild(gBg);
        svg.appendChild(textEl);
        clip.appendChild(svg);
        outer.appendChild(clip);
        bar.appendChild(outer);

        const tile = {
          outer,
          svg,
          rects: [],
          textEl,
          word,
          swatch: sw,
          nextShuffle: 0,
        };
        tiles.push(tile);

        function buildRects(m) {
          const bandTop = BASELINE_Y - BAND_ASCENT;
          const bandBottom = BASELINE_Y + BAND_DESCENT;
          for (let i = 0; i < m.glyphs.length; i++) {
            const g = m.glyphs[i];
            if (g.ch === " ") continue;
            const top = Math.max(bandTop, g.top - PAD_Y);
            const bottom = Math.min(bandBottom, g.bottom + PAD_Y);
            const next = m.glyphs[i + 1];
            const right = next ? next.x : g.x + g.w;
            const left = g.x - (i === 0 ? PAD_X : 0);
            const width = right - left + PAD_X;
            const rect = document.createElementNS(SVGNS, "rect");
            rect.setAttribute("x", String(left));
            rect.setAttribute("y", String(top));
            rect.setAttribute("width", String(width));
            rect.setAttribute("height", String(bottom - top));
            rect.style.fill = sw.bg;
            rect.style.transition =
              "fill " + COLOR_MS + "ms ease, y 160ms ease, height 160ms ease";
            gBg.appendChild(rect);
            tile.rects.push({
              el: rect,
              x0: left,
              x1: left + width,
              baseY: top,
              baseH: bottom - top,
              hovered: false,
            });
          }
          textEl.setAttribute("x", "0");
          textEl.setAttribute("y", String(BASELINE_Y));
          const vbX = -PAD_X;
          const vbW = m.width + PAD_X * 2;
          const vbY = bandTop;
          const vbH = bandBottom - bandTop;
          svg.setAttribute("viewBox", vbX + " " + vbY + " " + vbW + " " + vbH);
          svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
        }

        function buildFallback() {
          const rect = document.createElementNS(SVGNS, "rect");
          rect.setAttribute("x", "0");
          rect.setAttribute("y", "0");
          rect.setAttribute("width", "100");
          rect.setAttribute("height", "100");
          rect.style.fill = sw.bg;
          gBg.appendChild(rect);
          tile.rects.push({
            el: rect,
            x0: 0,
            x1: 100,
            baseY: 0,
            baseH: 100,
            hovered: false,
          });
          svg.setAttribute("viewBox", "0 0 100 100");
        }

        function layout() {
          const m = measureWord(word, fontFamily, "500");
          for (const r of tile.rects) r.el.remove();
          tile.rects = [];
          if (!m) {
            buildFallback();
            return;
          }
          buildRects(m);
        }

        function recolor() {
          const used = tiles.filter((t) => t !== tile).map((t) => t.swatch);
          const ns = randomSwatchAvoiding(used);
          tile.swatch = ns;
          for (const r of tile.rects) r.el.style.fill = ns.bg;
          textEl.style.fill = ns.fg;
        }

        function hoverLetter(e) {
          const rect = svg.getBoundingClientRect();
          if (rect.width < 1) return;
          const vb = svg.viewBox.baseVal;
          const scale = vb.width / rect.width;
          const grow = 2 * scale;
          const px = vb.x + ((e.clientX - rect.left) / rect.width) * vb.width;
          for (const r of tile.rects) {
            const isHit = px >= r.x0 && px < r.x1;
            if (isHit === r.hovered) continue;
            r.hovered = isHit;
            if (isHit) {
              r.el.style.y = (r.baseY - grow / 2) + "px";
              r.el.style.height = (r.baseH + grow) + "px";
            } else {
              r.el.style.y = r.baseY + "px";
              r.el.style.height = r.baseH + "px";
            }
          }
        }

        function clearHover() {
          for (const r of tile.rects) {
            if (!r.hovered) continue;
            r.hovered = false;
            r.el.style.y = r.baseY + "px";
            r.el.style.height = r.baseH + "px";
          }
        }

        svg.addEventListener("pointerenter", recolor);
        svg.addEventListener("pointermove", hoverLetter);
        svg.addEventListener("pointerleave", clearHover);

        tile._layout = layout;
        tile._recolor = recolor;
      });

      function doLayout() {
        for (const tile of tiles) tile._layout();
      }

      function reveal() {
        if (revealed) return;
        revealed = true;
        tiles.forEach((tile, i) => {
          const delay = i * FLY_STAGGER;
          const t = window.setTimeout(() => {
            tile.outer.style.gridTemplateColumns = "1fr";
            tile.svg.style.opacity = "1";
          }, delay);
        });
        const assembledAt = tiles.length * FLY_STAGGER + FLY_MS;
        tiles.forEach((tile) => {
          tile.nextShuffle =
            performance.now() +
            assembledAt +
            SHUFFLE_MIN +
            Math.random() * (SHUFFLE_MAX - SHUFFLE_MIN);
        });
      }

      function loop() {
        if (!running) return;
        now = performance.now();
        for (const tile of tiles) {
          if (tile.nextShuffle === 0) continue;
          if (now >= tile.nextShuffle) {
            tile._recolor();
            tile.nextShuffle =
              now + SHUFFLE_MIN + Math.random() * (SHUFFLE_MAX - SHUFFLE_MIN);
          }
        }
        raf = requestAnimationFrame(loop);
      }

      function start() {
        if (running || disposed) return;
        running = true;
        reveal();
        raf = requestAnimationFrame(loop);
      }

      function stop() {
        running = false;
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
      }

      function renderStill() {
        revealed = true;
        tiles.forEach((tile) => {
          tile.outer.style.transition = "none";
          tile.outer.style.gridTemplateColumns = "1fr";
          tile.svg.style.transition = "none";
          tile.svg.style.opacity = "1";
        });
      }

      function destroy() {
        disposed = true;
        stop();
        root.parentNode?.removeChild(root);
      }

      root.appendChild(bar);
      host.appendChild(root);
      doLayout();

      return {
        start,
        stop,
        renderStill,
        destroy,
        refreshFont: doLayout,
        root,
      };
    }

    // ─── bootstrap ───────────────────────────────────────────
    const host = document.getElementById("root");
    const prefersReduced = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    // Allow ?words=hello,world,foo to customize the sentence
    const params = new URLSearchParams(window.location.search);
    const wordsParam = params.get("words");
    let words = DEFAULT_WORDS;
    if (wordsParam) {
      const parsed = wordsParam.split(",").map(function(s) { return s.trim(); }).filter(Boolean);
      if (parsed.length > 0) words = parsed;
    }

    const tiles = createDesignTiles(host, words);

    if (prefersReduced) {
      tiles.renderStill();
    } else {
      tiles.start();
    }

    window._designTiles = tiles;
    window._designTilesWords = words;
  </script>
</body>
</html>
